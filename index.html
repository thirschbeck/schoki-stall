<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Schoki · Stallplan & Protokoll</title>
<meta name="theme-color" content="#141A20">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='12' fill='%23141A20'/><text x='32' y='45' font-size='38' text-anchor='middle' fill='%23E8B84B'>S</text></svg>">
<style>
:root{--bg:#F4F6F8;--card:#fff;--ink:#141A20;--ink2:#5C6773;--line:#DDE3E8;--acc:#0B5D8A;--acc2:#E8B84B;--ok:#1E7A4B;--warn:#B4470B;--r:14px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:16px;line-height:1.45}
header{position:sticky;top:0;z-index:20;background:var(--ink);color:#fff;padding:10px 14px calc(10px + env(safe-area-inset-top)) ;padding-top:calc(10px + env(safe-area-inset-top))}
.hrow{display:flex;align-items:center;gap:10px}
.logo{font-weight:800;font-size:19px;letter-spacing:.2px}
.logo span{color:var(--acc2)}
.sub{font-size:12px;color:#B9C4CE;margin-top:2px}
.who{margin-left:auto;background:#2A343D;border:0;color:#fff;border-radius:999px;padding:7px 12px;font-size:13px;font-weight:600}
.sync{font-size:11.5px;color:#9FB0BE;margin-top:6px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.dot{width:8px;height:8px;border-radius:50%;background:#3FB27F;display:inline-block}
.dot.off{background:#E8B84B}
nav{position:sticky;top:0;z-index:19;display:flex;gap:6px;overflow-x:auto;background:var(--ink);padding:8px 10px;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{flex:0 0 auto;background:#232D36;color:#C7D2DB;border:0;border-radius:999px;padding:9px 14px;font-size:14px;font-weight:600}
nav button.on{background:var(--acc2);color:#141A20}
main{padding:14px 12px 120px;max-width:760px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
h2{font-size:16px;margin:2px 0 10px}
h3{font-size:14px;margin:0 0 8px;color:var(--ink2);text-transform:uppercase;letter-spacing:.5px}
label{display:block;font-size:13px;font-weight:600;color:var(--ink2);margin:10px 0 4px}
input,select,textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;font-size:16px;background:#FBFCFD;color:var(--ink);font-family:inherit}
textarea{min-height:74px;resize:vertical}
.row{display:flex;gap:10px}.row>*{flex:1}
button.prim{width:100%;margin-top:14px;background:var(--acc);color:#fff;border:0;border-radius:12px;padding:14px;font-size:16px;font-weight:700}
button.sec{background:#EEF2F5;color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:14px;font-weight:600}
button.mini{background:none;border:0;color:var(--acc);font-weight:600;font-size:13.5px;padding:4px 2px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.chip{border:1px solid var(--line);background:#FBFCFD;border-radius:999px;padding:9px 13px;font-size:14.5px;font-weight:600}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff}
.eintrag{border-top:1px solid var(--line);padding:11px 0;display:flex;gap:10px}
.eintrag:first-child{border-top:0}
.who-badge{flex:0 0 40px;height:40px;border-radius:12px;background:#EEF2F5;color:var(--acc);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px}
.eintrag .t{font-weight:700}.eintrag .m{font-size:13.5px;color:var(--ink2);white-space:pre-wrap}
.tag{display:inline-block;background:#EEF2F5;color:var(--ink2);border-radius:999px;padding:2px 9px;font-size:12px;font-weight:700;margin-right:6px}
.tag.ok{background:#E4F3EA;color:var(--ok)}.tag.warn{background:#FBEADF;color:var(--warn)}
.day{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;background:#FBFCFD}
.day.today{border-color:var(--acc);background:#F0F7FB;box-shadow:0 0 0 2px #E3EFF7 inset}
.day .dh{display:flex;align-items:center;gap:8px;font-weight:700}
.day .dh small{margin-left:auto;color:var(--ink2);font-weight:600}
.day .dp{font-size:14px;color:var(--ink2);margin-top:4px}
.term{display:flex;gap:10px;align-items:flex-start;border-top:1px solid var(--line);padding:11px 0}
.term:first-child{border-top:0}
.term .ic{flex:0 0 38px;height:38px;border-radius:11px;background:#EEF2F5;display:flex;align-items:center;justify-content:center;font-size:18px}
.empty{color:var(--ink2);font-size:14px;text-align:center;padding:14px}
.tabs{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.tabs button{background:#EEF2F5;border:1px solid var(--line);border-radius:999px;padding:7px 12px;font-size:13px;font-weight:600;color:var(--ink2)}
.tabs button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
footer{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:10px 12px calc(10px + env(safe-area-inset-bottom));display:flex;gap:8px;max-width:760px;margin:0 auto}
footer button{flex:1}
.banner{background:#FFF7E3;border:1px solid #F0DCA6;color:#6B5320;border-radius:12px;padding:10px 12px;font-size:13.5px;margin-bottom:12px}
.modal{position:fixed;inset:0;background:rgba(16,22,28,.55);display:flex;align-items:flex-end;z-index:40}
.sheet{background:#fff;width:100%;max-width:760px;margin:0 auto;border-radius:18px 18px 0 0;padding:16px 14px calc(18px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto}
.hidden{display:none!important}
</style>
</head>
<body>
<header>
  <div class="hrow">
    <div>
      <div class="logo">Schoki <span>·</span> Stallplan</div>
      <div class="sub" id="subline">Plan · Futter · Protokoll · Termine · Turniere · Zubehör</div>
    </div>
    <button class="who" id="whoBtn">Wer?</button>
  </div>
  <div class="sync"><span class="dot" id="dot"></span><span id="syncTxt">verbinde …</span></div>
</header>
<nav>
  <button data-tab="heute" class="on">Heute</button>
  <button data-tab="woche">Woche</button>
  <button data-tab="futter">Futter</button>
  <button data-tab="verein">Verein</button>
  <button data-tab="proto">Protokoll</button>
  <button data-tab="termine">Termine</button>
  <button data-tab="turniere">Turniere</button>
  <button data-tab="zubehoer">Zubehör</button>
  <button data-tab="team">Team</button>
  <button data-tab="vertraege">Verträge</button>
</nav>
<main id="main"></main>
<footer>
  <button class="sec" id="btnReload">Aktualisieren</button>
  <button class="prim" id="btnNeu" style="margin-top:0">Eintrag erfassen</button>
</footer>

<div class="modal hidden" id="modal"><div class="sheet" id="sheet"></div></div>

<script>
/* ====== Konfiguration ====== */
const BUCKET = "HuCDKH1zjs9QPg6yTPeVqH";       // gemeinsamer Speicher (kvdb.io)
const KEY    = "schoki";
const API    = "https://kvdb.io/" + BUCKET + "/" + KEY;
const VEREIN = "https://kvdb.io/" + BUCKET + "/wuermtal";   // Vereinsplan (synchronisiert vom Server)
const VEREIN_SEITE = "https://reitverein-wuermtal.reitbuch.com/weekplan.php";
const CODE   = "schoki";                        // Familien-Code (kann hier geändert werden)
const POLL   = 15000;

const PERSONEN = ["Annika","Marta","Vivienne","Marie","Hanna","Thomas"];
const ROLLEN = {"Annika":"Hauptperson · Reitbeteiligung","Marta":"Vertretung für Annika","Vivienne":"reitet mit",
                "Marie":"Tochter · Mi + Do","Hanna":"Tochter · Mi + Do","Thomas":"Orga"};
const VERTRAEGE = [
  {t:"Vertrag über die vertrauensvolle Unterstützung bei der Betreuung",
   p:"Marta Simone · Vertretung für Annika Schneitz", d:"20.11.2026",
   f:"vertraege/Vertrag-Marta-Simone-Vertretung-Schocki.pdf"},
];
const AKTIV = ["Geführt (Dressur)","Longe","Ausritt","Bodenarbeit","Freispringen","Springen","Galopptraining",
               "Schrittrunde","Trabarbeit","Weide / Ruhe","Nur versorgt (Futter, Misten)","Eindecken","Sonstiges"];
const TERMART = [["physio","🩺 Physio"],["hufschmied","🐴 Hufschmied / Beschlag"],["impfung","💉 Impfung"],
                 ["zahnarzt","🦷 Zahnarzt"],["tierarzt","🩺 Tierarzt"],["wurmkur","🐛 Wurmkur"],
                 ["sattel","🪑 Sattel / Ausrüstung"],["sonstiges","📌 Sonstiges"]];
const WIEDER = [[0,"keine Wiederholung"],[4,"alle 4 Wochen"],[6,"alle 6 Wochen"],[8,"alle 8 Wochen"],
                [12,"alle 12 Wochen"],[26,"alle 6 Monate"],[52,"jährlich"]];
const PFLEGE = [["impfung",52,"Impfung – jährlich"],["hufschmied",6,"Beschlag / Hufe – alle 6 Wochen"],
                ["wurmkur",12,"Wurmkur – alle 12 Wochen"],["zahnarzt",52,"Zahnkontrolle – jährlich"],
                ["sattel",26,"Sattel / Ausrüstung – alle 6 Monate"]];
const TSTAT = [["geplant","geplant"],["genannt","genannt"],["gelaufen","gelaufen"],["absage","abgesagt"]];
const FEST = {3:{zeit:"15:00–16:00",hinweis:"Marie + Hanna"},4:{zeit:"15:30–16:30",hinweis:"Marie + Hanna"}};
const WOCHENTAG = ["Montag","Dienstag","Mittwoch","Donnerstag","Freitag","Samstag","Sonntag"];
const FUTTERART = ["Heu","Heucobs","Krippenfutter / Müsli","Hafer","Mineralfutter","Mash","Wasser frisch","Weide / Gras","Sonstiges"];
const ZART = [["sattel","Sattel"],["zaumzeug","Zaumzeug / Trense"],["halfter","Halfter / Strick"],
              ["decke","Decke"],["gamasche","Gamaschen / Bandagen"],["longe","Longe / Longiergurt"],
              ["putz","Putzzeug"],["helm","Helm"],["sonstiges","Sonstiges"]];
const ZUST = [["ok","in Ordnung"],["reparatur","reparaturbedürftig"],["defekt","defekt"],["weg","ausgemustert"]];

/* ====== Zustand ====== */
let doc = {v:1,stand:0,protokoll:{},termine:{},turniere:{},futter:{},futterlog:{},zubehoer:{},kontakte:{},plan:{},woche:{},tomb:{},wichtig:null};
let verein = null;
const grab = (g,id) => { doc.tomb[id] = Date.now(); delete doc[g][id]; };
let me = localStorage.getItem("schoki_wer") || "";
let pending = false, dirty = false, offline = false, codeOk = false;

/* ====== Hilfen ====== */
const $ = s => document.querySelector(s);
const iso = d => { const x = new Date(d); return x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0")+"-"+String(x.getDate()).padStart(2,"0"); };
const today = () => iso(new Date());
const parse = s => { const [y,m,t] = s.split("-").map(Number); return new Date(y,m-1,t); };
const dfmt = s => { const d = parse(s); return WOCHENTAG[(d.getDay()+6)%7].slice(0,2)+", "+String(d.getDate()).padStart(2,"0")+"."+String(d.getMonth()+1).padStart(2,"0")+"."+d.getFullYear(); };
const dshort = s => { const d = parse(s); return String(d.getDate()).padStart(2,"0")+"."+String(d.getMonth()+1).padStart(2,"0")+"."; };
const wd = s => WOCHENTAG[(parse(s).getDay()+6)%7];
const esc = t => String(t==null?"":t).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const rel = ts => { if(!ts) return "—"; const s = Math.round((Date.now()-ts)/1000); if(s<60) return "gerade eben";
  if(s<3600) return Math.round(s/60)+" Min"; if(s<86400) return Math.round(s/3600)+" Std"; return Math.round(s/86400)+" Tage"; };
const initials = n => (n||"?").slice(0,2);
function tage_bis(s){ const t = parse(today()), d = parse(s); return Math.round((d-t)/86400000); }

/* ====== Sync ====== */
let vereinZeit = 0;
async function ladeVerein(erzwungen){
  if(!erzwungen && Date.now() - vereinZeit < 600000) return;
  try{
    const r = await fetch(VEREIN + "?_=" + Date.now(), {cache:"no-store"});
    if(r.ok){ verein = await r.json(); vereinZeit = Date.now(); }
  }catch(e){ /* Vereinsplan ist Beiwerk – die App läuft auch ohne */ }
}
async function pull(first){
  try{
    const r = await fetch(API + "?_=" + Date.now(), {cache:"no-store"});
    if(r.status === 404){ offline = false; if(first){ await push(); } }
    else if(!r.ok) throw new Error(r.status);
    else {
      const remote = await r.json();
      merge(remote);
      offline = false;
    }
    setSync("synchron · Stand " + rel(doc.stand));
  }catch(e){ offline = true; setSync("offline – Daten liegen auf diesem Gerät"); }
  await ladeVerein();
  render();
}
function merge(r){
  if(!r || typeof r !== "object") return;
  const alt = doc.stand || 0;
  const newer = (a,b) => (b && (!a || (b.ts||0) > (a.ts||0))) ? b : a;
  for(const g of ["protokoll","termine","turniere","futter","futterlog","zubehoer","kontakte","plan"]){
    doc[g] = doc[g] || {};
    for(const k of Object.keys(r[g]||{})) doc[g][k] = newer(doc[g][k], r[g][k]);
  }
  if(r.woche) for(const k of Object.keys(r.woche)) doc.woche[k] = newer(doc.woche[k], r.woche[k]);
  if(r.wichtig && (!doc.wichtig || (r.wichtig.ts||0) > (doc.wichtig.ts||0))) doc.wichtig = r.wichtig;
  /* Löschungen wandern ausschließlich über Grabsteine (tomb). Fehlte ein Eintrag im
     neueren Stand, wurde er dort nicht zwingend gelöscht – ein Gerät kann vor dem
     Abgleich gespeichert haben. Deshalb wird hier nie allein wegen Fehlens gelöscht. */
  if((r.stand||0) > (doc.stand||0)) doc.stand = r.stand;
  const t = r.tomb||{}; for(const k of Object.keys(t)){
    for(const g of ["protokoll","termine","turniere","futter","futterlog","zubehoer","kontakte"]) if(!doc[g][k] || (doc[g][k].ts||0) < t[k]) delete doc[g][k];
    if(!doc.plan[k] || (doc.plan[k].ts||0) < t[k]) delete doc.plan[k];
  }
}
async function push(){
  doc.stand = Date.now();
  try{
    const r = await fetch(API, {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(doc)});
    if(!r.ok) throw new Error(r.status);
    offline = false; dirty = false; localStorage.setItem("schoki_cache", JSON.stringify(doc));
    setSync("gespeichert · " + rel(doc.stand));
  }catch(e){
    offline = true; localStorage.setItem("schoki_cache", JSON.stringify(doc));
    setSync("offline gespeichert – wird nachgereicht");
  }
}
function setSync(t){ $("#syncTxt").textContent = t; $("#dot").className = "dot" + (offline?" off":""); }
const save = async () => { dirty = true; await push(); };

/* ====== Erfassung ====== */
function sProtokoll(p){
  return {id:uid(), datum:p.datum, personen:p.personen, zeit:p.zeit, aktivitaet:p.aktivitaet,
          dauer:p.dauer, wie:p.wie||"", note:p.note||"", by:me, ts:Date.now()};
}
function sTermin(p){
  return {id:uid(), art:p.art, datum:p.datum, zeit:p.zeit||"", wer:p.personen||[], info:p.info||"",
          kosten:p.kosten||"", wieder:Number(p.wieder||0), erledigt:false, by:me, ts:Date.now()};
}
function naechsterTermin(t, abDatum){
  const wochen = Number(t.wieder||0); if(!wochen) return null;
  const grund = abDatum || today();
  let d = parse(t.datum);
  if(iso(d) <= grund) d = parse(grund);
  do { d.setDate(d.getDate() + wochen*7); } while(iso(d) <= grund);
  return {id:uid(), art:t.art, datum:iso(d), zeit:t.zeit||"", wer:(t.wer||[]).slice(), info:t.info||"",
          kosten:t.kosten||"", wieder:wochen, erledigt:false, vorher:t.id, by:me, ts:Date.now()};
}
function letzterTermin(art){
  const alle = Object.values(doc.termine||{}).filter(t => t.art===art && t.erledigt)
    .sort((a,b) => (b.datum||"").localeCompare(a.datum||""));
  return alle[0] || null;
}
function sTurnier(p){
  return {id:uid(), name:p.name, ort:p.ort||"", von:p.von, bis:p.bis||"", pruefung:p.pruefung||"",
          nennung:p.nennung||"", personen:p.personen||[], status:p.status||"geplant",
          kosten:p.kosten||"", info:p.info||"", by:me, ts:Date.now()};
}
function sFutter(p){
  return {id:uid(), zeit:p.zeit||"", art:p.art||"Heu", menge:p.menge||"", wer:p.personen||[],
          info:p.info||"", taeglich:true, by:me, ts:Date.now()};
}
function sZubehoer(p){
  return {id:uid(), name:p.name, art:p.art||"sonstiges", groesse:p.groesse||"", zustand:p.zustand||"ok",
          ort:p.ort||"", wer:p.wer||"", kosten:p.kosten||"", info:p.info||"", by:me, ts:Date.now()};
}
/* Gefüttert-Haken je Tag und Futterplatz */
const fKey = (datum, id) => datum + ":" + id;
const fErledigt = (datum, id) => doc.futterlog[fKey(datum, id)] || null;
function futterHeute(){
  return Object.values(doc.futter||{}).sort((a,b) => (a.zeit||"99").localeCompare(b.zeit||"99"));
}

/* ====== Rendern ====== */
let tab = "heute", pf = "alle";
function render(){
  document.querySelectorAll("nav button").forEach(b => b.classList.toggle("on", b.dataset.tab === tab));
  $("#whoBtn").textContent = me ? me : "Wer?";
  const m = $("#main");
  if(tab === "heute") m.innerHTML = vHeute();
  else if(tab === "woche") m.innerHTML = vWoche();
  else if(tab === "proto") m.innerHTML = vProto();
  else if(tab === "termine") m.innerHTML = vTermine();
  else if(tab === "turniere") m.innerHTML = vTurniere();
  else if(tab === "futter") m.innerHTML = vFutter();
  else if(tab === "verein") m.innerHTML = vVerein();
  else if(tab === "zubehoer") m.innerHTML = vZubehoer();
  else if(tab === "vertraege") m.innerHTML = vVertraege();
  else m.innerHTML = vTeam();
  bind();
}
function zuletzt(n){ return Object.values(doc.protokoll||{}).filter(x => x.datum === n).sort((a,b)=>a.ts-b.ts); }
function planTag(n){
  const p = (doc.plan||{})[n]; if(p) return p;
  const w = (doc.woche||{})[String((parse(n).getDay()+6)%7===0?"mo":["mo","di","mi","do","fr","sa","so"][(parse(n).getDay()+6)%7])];
  return w ? {personen:w.personen||[],zeit:w.zeit||"",aktivitaet:w.aktivitaet||"",ts:w.ts,aus:true} : null;
}
function vHeute(){
  const n = today(), e = zuletzt(n), p = planTag(n), w = (doc.wichtig && (Date.now()-(doc.wichtig.ts||0)) < 7*86400000) ? doc.wichtig : null;
  const faellig = Object.values(doc.termine||{}).filter(t => !t.erledigt && tage_bis(t.datum) <= 14)
                    .sort((a,b) => a.datum.localeCompare(b.datum));
  let h = "";
  if(w) h += `<div class="banner"><b>Aushang von ${esc(w.by)}:</b> ${esc(w.text)}</div>`;
  h += vUeberblick();
  h += `<div class="card"><h2>Heute · ${dfmt(n)}</h2>
    <div class="dp">${p ? `<b>Geplant:</b> ${(p.personen||[]).join(", ")||"—"}${p.zeit?" · "+esc(p.zeit):""}${p.aktivitaet?" · "+esc(p.aktivitaet):""}${p.aus?' <span class="tag">Wochenregel</span>':''}`
    : `<span class="tag warn">noch nichts eingetragen</span> Tägliche Betreuung ist offen.`}</div>
    <h3 style="margin-top:14px">Was ist heute passiert?</h3>`;
  if(e.length===0) h += `<div class="empty">Noch kein Protokolleintrag für heute.</div>`;
  else h += e.map(x => `<div class="eintrag"><div class="who-badge">${esc(initials(x.by||x.personen?.[0]))}</div>
      <div style="flex:1"><div class="t">${esc((x.personen||[]).join(", "))} · ${esc(x.aktivitaet)}${x.dauer?" · "+esc(x.dauer)+" Min":""}</div>
      <div class="m">${esc(x.wie)}${x.note?"\n"+esc(x.note):""}</div>
      <div><span class="tag">${esc(x.zeit||"")}</span><span class="tag">erfasst von ${esc(x.by||"—")}</span></div></div>
      <button class="mini" data-del-proto="${x.id}">löschen</button></div>`).join("");
  h += `<button class="prim" data-neu="proto">Eintrag erfassen</button></div>`;
  const fp = futterHeute(), off = fp.filter(x => !fErledigt(n, x.id));
  h += `<div class="card"><h2>Futter heute</h2>`;
  h += fp.length ? fp.map(f => {
    const erl = fErledigt(n, f.id);
    return `<div class="term"><div class="ic">🍎</div><div style="flex:1">
      <div class="t">${f.zeit?esc(f.zeit)+" · ":""}${esc(f.art)}${f.menge?" – "+esc(f.menge):""}</div>
      <div class="m">${(f.wer||[]).length?"wer: "+(f.wer||[]).map(esc).join(", "):"wer: noch offen"}</div>
      <div>${erl?`<span class="tag ok">gefüttert · ${esc(erl.by||"")}</span>`:`<span class="tag warn">noch offen</span>`}</div></div>

}

    <div class="dp">Sattel, Zaumzeug, Decken und alles andere. Geht etwas kaputt: Zustand auf „defekt" oder „reparaturbedürftig" setzen – dann steht es bei allen oben und auf „Heute".</div>`;

      <div class="m">${zus}${z.info?"\n"+esc(z.info):""}</div>

/* ====== Bindung ====== */
function bind(){
  document.querySelectorAll("[data-neu]").forEach(b => b.onclick = () => {
    if(!me){ fWer(); return; }
    if(b.dataset.neu === "proto") fProto(b.dataset.datum);
    else if(b.dataset.neu === "termin") fTermin();
    else if(b.dataset.neu === "turnier") fTurnier();
    else if(b.dataset.neu === "pflege") fTermin({art:b.dataset.art, wieder:Number(b.dataset.wieder)});
    else if(b.dataset.neu === "futter") fFutter();
    else if(b.dataset.neu === "zubehoer") fZubehoer();
    else if(b.dataset.neu === "kontakt") fKontakt();
    else fWichtig();
  });
  document.querySelectorAll("[data-del-proto]").forEach(b => b.onclick = async () => {
    if(!confirm("Eintrag wirklich löschen?")) return;
    grab("protokoll", b.dataset.delProto); await save(); render(); });
  document.querySelectorAll("[data-del-term]").forEach(b => b.onclick = async () => {
    if(!confirm("Termin löschen?")) return; grab("termine", b.dataset.delTerm); await save(); render(); });
  document.querySelectorAll("[data-del-turn]").forEach(b => b.onclick = async () => {
    if(!confirm("Turnier löschen?")) return; grab("turniere", b.dataset.delTurn); await save(); render(); });
  document.querySelectorAll("[data-tset]").forEach(b => b.onclick = async () => {
    const t = doc.turniere[b.dataset.tset]; if(!t) return;
    t.status = b.dataset.status; t.ts = Date.now(); t.by = me; await save(); render(); });
  document.querySelectorAll("[data-erl]").forEach(b => b.onclick = async () => {
    const t = doc.termine[b.dataset.erl];
    const wirdErledigt = !t.erledigt;
    t.erledigt = !t.erledigt; t.ts = Date.now(); t.by = me;
    if(wirdErledigt && Number(t.wieder||0) > 0){
      const n = naechsterTermin(t, today());
      const schonDa = Object.values(doc.termine||{}).some(x => x.vorher === t.id && !x.erledigt);
      if(n && !schonDa) doc.termine[n.id] = n;
    }
    await save(); render(); });
  document.querySelectorAll("[data-plan]").forEach(b => b.onclick = () => { if(!me) return fWer(); fPlan(b.dataset.plan); });
  document.querySelectorAll("[data-verein]").forEach(b => b.onclick = async () => { await ladeVerein(true); render(); });
  document.querySelectorAll("[data-kedit]").forEach(b => b.onclick = () => fKontakt(b.dataset.kedit));
  document.querySelectorAll("[data-del-kontakt]").forEach(b => b.onclick = async () => {
    if(!confirm("Kontakt löschen?")) return; grab("kontakte", b.dataset.delKontakt); await save(); render(); });
  document.querySelectorAll("[data-del-futter]").forEach(b => b.onclick = async () => {
    if(!confirm("Futterzeit löschen?")) return; grab("futter", b.dataset.delFutter); await save(); render(); });
  document.querySelectorAll("[data-fedit]").forEach(b => b.onclick = () => { if(!me) return fWer(); fFutter(b.dataset.fedit); });
  document.querySelectorAll("[data-del-zub]").forEach(b => b.onclick = async () => {
    if(!confirm("Teil aus der Liste nehmen?")) return; grab("zubehoer", b.dataset.delZub); await save(); render(); });
  document.querySelectorAll("[data-zedit]").forEach(b => b.onclick = () => { if(!me) return fWer(); fZubehoer(b.dataset.zedit); });
  document.querySelectorAll("[data-zset]").forEach(b => b.onclick = async () => {
    const z = doc.zubehoer[b.dataset.zset]; if(!z) return;
    z.zustand = b.dataset.zustand; z.ts = Date.now(); z.by = me; await save(); render(); });
  document.querySelectorAll("[data-fut]").forEach(b => b.onclick = async () => {
    const id = b.dataset.fut, k = fKey(today(), id);
    if(doc.futterlog[k]) delete doc.futterlog[k];
    else doc.futterlog[k] = {id:k, slot:id, datum:today(), by:me, ts:Date.now()};
    await save(); render(); });
  document.querySelectorAll("[data-goto]").forEach(b => b.onclick = () => { tab = b.dataset.goto; render(); });
  document.querySelectorAll("[data-woche]").forEach(b => b.onclick = () => { if(!me) return fWer(); fWoche(b.dataset.woche); });
  document.querySelectorAll("[data-als]").forEach(b => b.onclick = () => { me = b.dataset.als; localStorage.setItem("schoki_wer", me); render(); });
  document.querySelectorAll("[data-pf]").forEach(b => b.onclick = () => { pf = b.dataset.pf; render(); });
  const now = $("#btnNow"); if(now) now.onclick = async () => { await pull(); };
}
document.querySelectorAll("nav button").forEach(b => b.onclick = () => { tab = b.dataset.tab; render(); });
$("#whoBtn").onclick = fWer;
$("#btnNeu").onclick = () => { if(!me) return fWer(); fProto(); };
$("#btnReload").onclick = async () => { await pull(); };
$("#modal").onclick = e => { if(e.target.id === "modal") closeSheet(); };
document.addEventListener("visibilitychange", () => { if(!document.hidden) pull(); });
window.addEventListener("online", () => pull());

/* ====== Start ====== */
if("serviceWorker" in navigator){ navigator.serviceWorker.register("sw.js").catch(() => {}); }
(async function start(){
  if(!codeOk){
    const c = prompt("Familien-Code für Schoki:");
    if(c !== null && c.trim().toLowerCase() !== CODE){ alert("Falscher Code."); }
    codeOk = true;
  }
  try{ const c = localStorage.getItem("schoki_cache"); if(c) merge(JSON.parse(c)); }catch(e){}
  await pull(true);
  render();
  setInterval(() => { if(!document.hidden) pull(); }, POLL);
})();
</script>
