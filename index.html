<script>
/* ====== Konfiguration ====== */

const POLL   = 15000;

const PERSONEN = ["Annika","Marta","Vivienne","Marie","Hanna","Thomas"];
const ROLLEN = {"Annika":"Hauptperson · Reitbeteiligung","Marta":"Vertretung für Annika","Vivienne":"reitet mit",
                "Marie":"Tochter · Mi + Do","Hanna":"Tochter · Mi + Do","Thomas":"Orga"};
const VERTRAEGE = [
  {t:"Vertrag über die vertrauensvolle Unterstützung bei der Betreuung",

];
const AKTIV = ["Geführt (Dressur)","Longe","Ausritt","Bodenarbeit","Freispringen","Springen","Galopptraining",
               "Schrittrunde","Trabarbeit","Weide / Ruhe","Nur versorgt (Futter, Misten)","Eindecken","Sonstiges"];
const TERMART = [["physio","🩺 Physio"],["hufschmied","🐴 Hufschmied / Beschlag"],["impfung","💉 Impfung"],
                 ["zahnarzt","🦷 Zahnarzt"],["tierarzt","🩺 Tierarzt"],["wurmkur","🐛 Wurmkur"],["kotprobe","🔬 Kotprobe / Befund"],
                 ["sattel","🪑 Sattel / Ausrüstung"],["sonstiges","📌 Sonstiges"]];
const WIEDER = [[0,"keine Wiederholung"],[4,"alle 4 Wochen"],[6,"alle 6 Wochen"],[8,"alle 8 Wochen"],
                [12,"alle 12 Wochen"],[26,"alle 6 Monate"],[52,"jährlich"]];
const PFLEGE = [["impfung",0,"Impfung – nur tierärztlich bestätigt"],["hufschmied",6,"Beschlag / Hufe – alle 6 Wochen"],
                ["wurmkur",0,"Wurmkur / Kotprobe – nur tierärztlich bestätigt"],["zahnarzt",52,"Zahnkontrolle – jährlich"],
                ["sattel",26,"Sattel / Ausrüstung – alle 6 Monate"]];
const TSTAT = [["geplant","geplant"],["genannt","genannt"],["gelaufen","gelaufen"],["absage","abgesagt"]];
const FEST = {3:{zeit:"15:00–16:00",hinweis:"Marie + Hanna"},4:{zeit:"15:30–16:30",hinweis:"Marie + Hanna"}};
const WOCHENTAG = ["Montag","Dienstag","Mittwoch","Donnerstag","Freitag","Samstag","Sonntag"];
const FUTTERART = ["Heu","Heucobs","Krippenfutter / Müsli","Hafer","Mineralfutter","Mash","Wasser frisch","Weide / Gras","Sonstiges"];
const ZART = [["sattel","Sattel"],["zaumzeug","Zaumzeug / Trense"],["halfter","Halfter / Strick"],
              ["decke","Decke"],["gamasche","Gamaschen / Bandagen"],["longe","Longe / Longiergurt"],
              ["putz","Putzzeug"],["helm","Helm"],["sonstiges","Sonstiges"]];
const ZUST = [["ok","in Ordnung"],["reparatur","reparaturbedürftig"],["defekt","defekt"],["weg","ausgemustert"]];

/* ====== Zustand ====== */
let doc = {v:2,stand:0,protokoll:{},termine:{},gesundheit:{},betreuungszusagen:{},fragen:{},antworten:{},pushabos:{},turniere:{},futter:{},futterlog:{},zubehoer:{},kontakte:{},plan:{},woche:{},tomb:{},wichtig:null};
let verein = null;
const grab = (g,id) => { doc.tomb[id] = Date.now(); delete doc[g][id]; };
let me = localStorage.getItem("schoki_wer") || "";
let pending = false, dirty = false, offline = false, codeOk = false;
let nachrichtenBezug = null;

/* ====== Hilfen ====== */
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const iso = d => { const x = new Date(d); return x.getFullYear()+"-"+String(x.getMonth()+1).padStart(2,"0")+"-"+String(x.getDate()).padStart(2,"0"); };
const today = () => iso(new Date());
const parse = s => { const [y,m,t] = s.split("-").map(Number); return new Date(y,m-1,t); };
const dfmt = s => { const d = parse(s); return WOCHENTAG[(d.getDay()+6)%7].slice(0,2)+", "+String(d.getDate()).padStart(2,"0")+"."+String(d.getMonth()+1).padStart(2,"0")+"."+d.getFullYear(); };
const dshort = s => { const d = parse(s); return String(d.getDate()).padStart(2,"0")+"."+String(d.getMonth()+1).padStart(2,"0")+"."; };
const wd = s => WOCHENTAG[(parse(s).getDay()+6)%7];
const esc = t => String(t==null?"":t).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const rel = ts => { if(!ts) return "—"; const s = Math.round((Date.now()-ts)/1000); if(s<60) return "gerade eben";
  if(s<3600) return Math.round(s/60)+" Min"; if(s<86400) return Math.round(s/3600)+" Std"; return Math.round(s/86400)+" Tage"; };
const initials = n => (n||"?").slice(0,2);
function tage_bis(s){ const t = parse(today()), d = parse(s); return Math.round((d-t)/86400000); }

/* ====== Sync ====== */
let vereinZeit = 0;
async function ladeVerein(erzwungen){
  if(!erzwungen && Date.now() - vereinZeit < 600000) return;
  try{
    const r = await fetch(VEREIN + "?_=" + Date.now(), {cache:"no-store"});
    if(r.ok){ verein = await r.json(); vereinZeit = Date.now(); }
  }catch(e){ /* Vereinsplan ist Beiwerk – die App läuft auch ohne */ }
}
async function pull(first){
  try{
    const r = await fetch(API + "?_=" + Date.now(), {cache:"no-store"});
    if(r.status === 404){ offline = false; if(first){ await push(); } }
    else if(!r.ok) throw new Error(r.status);
    else {
      const remote = await r.json();
      merge(remote);
      offline = false;
    }
    if(dirty) await push();
    else localStorage.setItem("schoki_cache", JSON.stringify(doc));
    if(!dirty) setSync("synchron · Stand " + rel(doc.stand));
  }catch(e){ offline = true; setSync("offline – Daten liegen auf diesem Gerät"); }
  await ladeVerein();
  render();
}
function merge(r){
  if(!r || typeof r !== "object") return;
  const newer = (a,b) => (b && (!a || (b.ts||0) > (a.ts||0))) ? b : a;
  const map = x => x && typeof x === "object" && !Array.isArray(x);
  const sicher = k => !["__proto__","prototype","constructor"].includes(k);
  /* Auch zukünftige Record-Collections erhalten; fehlende Felder bedeuten nie Löschen. */
  for(const g of Object.keys(r).filter(sicher)){
    if(["v","stand","tomb","wichtig"].includes(g)) continue;
    if(map(r[g])){
      if(!map(doc[g])) doc[g] = {};
      for(const k of Object.keys(r[g]).filter(sicher)){
        if(g === "antworten" && doc[g][k]) continue; // Antworten werden nie bearbeitet.
        doc[g][k] = newer(doc[g][k], r[g][k]);
      }
    } else if(!(g in doc)) doc[g] = r[g];
  }
  if(r.wichtig) doc.wichtig = newer(doc.wichtig, r.wichtig);
  doc.v = Math.max(doc.v||1, r.v||1);
  doc.stand = Math.max(doc.stand||0, r.stand||0);
  doc.tomb = doc.tomb || {};
  for(const k of Object.keys(r.tomb||{}).filter(sicher)) doc.tomb[k] = Math.max(doc.tomb[k]||0, r.tomb[k]||0);
  /* Lokale UND fremde Grabsteine bleiben erhalten und gelten auch für neue Collections. */
  for(const g of Object.keys(doc).filter(g => !["tomb","wichtig"].includes(g) && map(doc[g])))
    for(const k of Object.keys(doc.tomb))
      if(doc[g][k] && (doc[g][k].ts||0) <= doc.tomb[k]) delete doc[g][k];
}
async function push(){
  try{
    /* Kein blinder POST aus leerem/älterem Cache. Kein Transaktionsersatz:
       konkurrierende alte Clients können weiterhin den Gesamtspeicher ersetzen. */
    const aktuell = await fetch(API + "?_=" + Date.now(), {cache:"no-store"});
    if(aktuell.ok) merge(await aktuell.json());
    else if(aktuell.status !== 404) throw new Error(aktuell.status);
    doc.stand = Date.now();
    const r = await fetch(API, {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(doc)});
    if(!r.ok) throw new Error(r.status);
    offline = false; dirty = false; localStorage.setItem("schoki_cache", JSON.stringify(doc));
    setSync("gespeichert · " + rel(doc.stand));
  }catch(e){
    offline = true; localStorage.setItem("schoki_cache", JSON.stringify(doc));
    setSync("offline gespeichert – wird nachgereicht");
  }
}
function setSync(t){ $("#syncTxt").textContent = t; $("#dot").className = "dot" + (offline?" off":""); }
const save = async () => { dirty = true; await push(); };

/* ====== Geräte-Benachrichtigungen (verschlüsseltes Abo) ======
   Kein automatischer WhatsApp-Versand. Push geht erst nach ausdrücklicher
   Geräteaktivierung und Erlaubnis des Nutzers auf dessen eigenem Handy.
   Im gemeinsamen Speicher liegt nur ein verschlüsseltes Abo, kein Klartext-Endpoint. */
const PUSHK = (typeof window !== "undefined" && window.SCHOKI_PUSH) || {version:1,vapidPublicKey:"",subscriptionPublicKey:""};
const b64u = u8 => btoa(String.fromCharCode.apply(null, u8)).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
const unb64u = s => Uint8Array.from(atob(String(s).replace(/-/g,"+").replace(/_/g,"/")), c => c.charCodeAt(0));
async function aboBauen(p){
  const c = p.crypto || (typeof crypto !== "undefined" ? crypto : null);
  if(!c || !c.subtle) throw new Error("Verschlüsselung nicht verfügbar");
  const schluessel = await c.subtle.generateKey({name:"AES-GCM", length:256}, true, ["encrypt"]);
  const iv = c.getRandomValues(new Uint8Array(12));
  const roh = new Uint8Array(await c.subtle.exportKey("raw", schluessel));
  const klartext = new TextEncoder().encode(JSON.stringify({person:p.person, subscription:p.subscription}));
  const ct = new Uint8Array(await c.subtle.encrypt({name:"AES-GCM", iv}, schluessel, klartext));
  const rsa = await c.subtle.importKey("spki", unb64u(p.publicKey), {name:"RSA-OAEP", hash:"SHA-256"}, false, ["encrypt"]);
  const wrapped = new Uint8Array(await c.subtle.encrypt({name:"RSA-OAEP"}, rsa, roh));
  return {id:uid(), person:p.person, ts:Date.now(), version:1, iv:b64u(iv), ciphertext:b64u(ct), wrappedKey:b64u(wrapped)};
}
async function geraetAktivieren(person, env){
  const N = (env && env.Notification) || (typeof Notification !== "undefined" ? Notification : null);
  if(!N || N.permission !== "granted") return {aktiv:false, grund:"Erlaubnis nicht erteilt"};
  const nav = (env && env.navigator) || (typeof navigator !== "undefined" ? navigator : null);
  const c = (env && env.crypto) || (typeof crypto !== "undefined" ? crypto : null);
  if(!nav || !nav.serviceWorker || !nav.serviceWorker.ready) return {aktiv:false, grund:"Kein Service Worker"};
  const reg = await nav.serviceWorker.ready;
  if(!reg.pushManager) return {aktiv:false, grund:"Kein Push-Dienst"};
  let sub = await reg.pushManager.getSubscription();
  if(!sub) sub = await reg.pushManager.subscribe({userVisibleOnly:true, applicationServerKey:unb64u(PUSHK.vapidPublicKey)});
  const rec = await aboBauen({subscription:(sub.toJSON ? sub.toJSON() : sub), person, publicKey:PUSHK.subscriptionPublicKey, crypto:c});
  doc.pushabos[rec.id] = rec;
  return {aktiv:true, id:rec.id};
}
function aboStatus(person){
  return Object.values(doc.pushabos||{}).some(a => a.person === person)
    ? "Gerät angemeldet – Zustellung erst nach Test bestätigt" : "";
}
/* Eigenes Abo ausschalten: nur eigene Zuordnung, fremde Abos bleiben unangetastet. */
function aboAusschalten(id, env){
  const rec = (doc.pushabos||{})[id];
  if(!rec || rec.person !== me) return false;
  grab("pushabos", id);
  const nav = (env && env.navigator) || (typeof navigator !== "undefined" ? navigator : null);
  try{
    if(nav && nav.serviceWorker && nav.serviceWorker.ready)
      nav.serviceWorker.ready.then(r => r.pushManager && r.pushManager.getSubscription && r.pushManager.getSubscription())
        .then(s => { if(s && s.unsubscribe) return s.unsubscribe(); }).catch(() => {});
  }catch(e){}
  return true;
}
const istIOS = () => typeof navigator !== "undefined" && /iPad|iPhone|iPod/.test(navigator.userAgent || "");
const alsApp = () => typeof window !== "undefined" && window.matchMedia && window.matchMedia("(display-mode: standalone)").matches;

/* ====== Erfassung ====== */
function sProtokoll(p){
  return {id:uid(), datum:p.datum, personen:p.personen, zeit:p.zeit, aktivitaet:p.aktivitaet,
          dauer:p.dauer, wie:p.wie||"", note:p.note||"", by:me, ts:Date.now()};
}
function sTermin(p){
  if(!datumOK(p.datum)) throw new Error("Bitte ein gültiges Termindatum eintragen.");
  const med=medizinisch(p.art),wochen=Number(p.wieder||0);
  if(!Number.isInteger(wochen) || wochen<0) throw new Error("Bitte Intervall prüfen.");
  if(med && wochen && !p.wiederQuelle?.trim()) throw new Error("Für das Intervall fehlt die tierärztliche Bestätigung.");
  if(med && p.folgeDatum && (!datumOK(p.folgeDatum) || p.folgeDatum<=p.datum || !p.folgeQuelle?.trim())) throw new Error("Nächste Fälligkeit und tierärztlichen Beleg prüfen.");
  return {id:uid(), art:p.art, datum:p.datum, zeit:p.zeit||"", wer:p.personen||[], info:p.info||"",
          kosten:p.kosten||"", wieder:wochen,wiederQuelle:med?p.wiederQuelle||"":"",folgeDatum:med?p.folgeDatum||"":"",folgeQuelle:med?p.folgeQuelle||"":"", organisation:PERSONEN.includes(p.organisation)?p.organisation:"",

const medizinisch = art => ["impfung","wurmkur","kotprobe"].includes(art);
function naechsterTermin(t, abDatum){
  const wochen = Number(t.wieder||0);
  if(medizinisch(t.art)){
    let datum = t.folgeQuelle && t.folgeDatum > t.datum ? t.folgeDatum : "";
    if(!datum && wochen > 0 && t.wiederQuelle){ const d = parse(t.datum); d.setDate(d.getDate()+wochen*7); datum = iso(d); }
    if(!datum) return null;
    return {...t, id:uid(), datum, erledigt:false, status:"geplant", vorher:t.id,
      folgeDatum:"", folgeQuelle:"", by:me, ts:Date.now()};
  }
  if(!wochen) return null;
  const grund = abDatum || today();
  let d = parse(t.datum);
  if(iso(d) <= grund) d = parse(grund);
  do { d.setDate(d.getDate() + wochen*7); } while(iso(d) <= grund);
  return {id:uid(), art:t.art, datum:iso(d), zeit:t.zeit||"", wer:(t.wer||[]).slice(), info:t.info||"",
          kosten:t.kosten||"", wieder:wochen, erledigt:false, vorher:t.id, by:me, ts:Date.now()};
}

function vUeberblick(){
  const n = today();
  const p = planTag(n);
  const f = futterHeute(), offF = f.filter(x => !fErledigt(n, x.id));
  const pfl = PFLEGE.map(([art,,label]) => ({label, s:pflegeStand(art)}))
    .filter(x => x.s.faellig && tage_bis(x.s.faellig) <= 14)
    .sort((a,b) => a.s.faellig.localeCompare(b.s.faellig));
  const t0 = Object.values(doc.turniere||{})
    .filter(t => t.status !== "gelaufen" && t.status !== "absage" && tage_bis(t.bis || t.von) >= 0)
    .sort((a,b) => (a.von||"").localeCompare(b.von||""))[0];
  const def = Object.values(doc.zubehoer||{}).filter(z => z.zustand === "defekt" || z.zustand === "reparatur");
  const naech = Object.values(doc.termine||{}).filter(t => !t.erledigt).sort((a,b) => a.datum.localeCompare(b.datum))[0];
  const zeile = (icon, titel, zusatz, ziel, warn) => `<div class="term" data-goto="${ziel}"><div class="ic">${icon}</div>
    <div style="flex:1"><div class="t">${titel}</div><div class="m">${zusatz}</div></div>${warn?`<span class="tag warn">${warn}</span>`:""}</div>`;
  let h = `<div class="card"><h2>Überblick</h2><div class="dp">Alles auf einen Blick – antippen führt zum passenden Reiter.</div>`;
  h += zeile("📋", p ? `${esc((p.personen||[]).join(", "))||"—"}${p.zeit?" · "+esc(p.zeit):""}` : "Heute noch nichts geplant",
        p && p.aktivitaet ? esc(p.aktivitaet) : "Betreuung offen", "woche", p ? "" : "offen");
  if(f.length) h += zeile("🍎", offF.length ? `${offF.length} von ${f.length} Fütterungen offen` : "Futter komplett erledigt",
        offF.length ? offF.map(x => esc(x.zeit||"?")+" "+esc(x.art)).join(" · ") : "heute alles gefüttert", "futter", offF.length ? "heute" : "");
  if(pfl.length) h += zeile("🛠", `${pfl.length} Pflegetermin(e) bald fällig`,
        pfl.map(x => esc(x.label)+" am "+dfmt(x.s.faellig)).join(" · "), "termine", "bald");
  if(t0) h += zeile("🏆", esc(t0.name), `${dfmt(t0.von)}${t0.nennung?" · Nennung bis "+dfmt(t0.nennung):""} · in ${tage_bis(t0.von)} Tagen`, "turniere");
  if(naech){ const d = tage_bis(naech.datum);
    h += zeile("📅", esc((TERMART.find(a=>a[0]===naech.art)||["","Termin"])[1].replace(/^\S+\s/,"")),
      `${dfmt(naech.datum)}${naech.zeit?" · "+esc(naech.zeit):""} · ${d<0?Math.abs(d)+" Tage überfällig":"in "+d+" Tagen"}`, "termine", d<0?"überfällig":""); }
  if(def.length) h += zeile("⚠️", `${def.length} Teil(e) Zubehör kaputt`, def.map(z => esc(z.name)).join(" · "), "zubehoer", "kaputt");
  h += `</div>`;
  return h;
}

  $("#tArt").onchange=medMaske; medMaske();
  $("#sheet").addEventListener("click", e => { const b = e.target.closest("[data-tp]");
    if(b){ const p = b.dataset.tp; if(sel.has(p)){sel.delete(p);b.classList.remove("on");} else {sel.add(p);b.classList.add("on");} } });
  $("#tAb").addEventListener("click", closeSheet);
  $("#tOk").addEventListener("click", async () => {
    if(!datumOK($("#tDatum").value)) return alert("Bitte ein gültiges Termindatum eintragen.");
    const med=medizinisch($("#tArt").value); let neu;
    try{ neu = sTermin({art:$("#tArt").value, datum:$("#tDatum").value, zeit:$("#tZeit").value.trim(),
      organisation:$("#tOrg").value,status:$("#tStatus").value,wieder:med?$("#tMedWochen").value:$("#tWieder").value,
      wiederQuelle:med?$("#tWBeleg").value.trim():"",folgeDatum:med?$("#tFolge").value:"",folgeQuelle:med?$("#tFolgeBeleg").value.trim():"",
      personen:[...sel], kosten:$("#tKosten").value.trim(), info:$("#tInfo").value.trim()}); }catch(e){return alert(e.message);}
    if(alt && !$("#tStatus").value) delete neu.status;
    const t = alt ? {...alt,...neu,id:alt.id,erledigt:alt.erledigt} : neu;
    doc.termine[t.id] = t; closeSheet(); await save(); render();
  });
}
function fTurnier(){
  sheet(`<h2>Turnier eintragen</h2>
    <label>Turnier</label><input type="text" id="uName" placeholder="z. B. Hallenturnier Gräfelfing">
    <label>Ort / Anlage</label><input type="text" id="uOrt" placeholder="z. B. Reitanlage Gräfelfing">
    <div class="row"><div><label>Beginn</label><input type="date" id="uVon" value="${today()}"></div>
      <div><label>Ende (optional)</label><input type="date" id="uBis"></div></div>
    <label>Prüfung / Klasse</label><input type="text" id="uPruef" placeholder="z. B. E-Dressur, Stilspringen A">
    <label>Nennungsschluss</label><input type="date" id="uNenn">
    <label>Wer reitet?</label><div class="chips" id="uPers">${PERSONEN.map(p=>`<button class="chip" data-up="${p}">${p}</button>`).join("")}</div>
    <label>Status</label><select id="uStat">${TSTAT.map(s=>`<option value="${s[0]}">${s[1]}</option>`).join("")}</select>
    <label>Kosten / Startgeld</label><input type="text" id="uKosten" placeholder="z. B. 25 €">
    <label>Notiz</label><textarea id="uInfo" placeholder="Box, Zeiten, wer fährt, Papiere …"></textarea>
    <button class="prim" id="uOk">Speichern</button><br><button class="sec" style="width:100%;margin-top:8px" id="uAb">Abbrechen</button>`);
  const sel = new Set();
  $("#sheet").addEventListener("click", e => { const b = e.target.closest("[data-up]");
    if(b){ const p = b.dataset.up; if(sel.has(p)){sel.delete(p);b.classList.remove("on");} else {sel.add(p);b.classList.add("on");} } });
  $("#uAb").addEventListener("click", closeSheet);
  $("#uOk").addEventListener("click", async () => {
    const name = $("#uName").value.trim();
    if(!name){ alert("Bitte einen Turniernamen eintragen."); return; }
    const t = sTurnier({name, ort:$("#uOrt").value.trim(), von:$("#uVon").value||today(), bis:$("#uBis").value,
      pruefung:$("#uPruef").value.trim(), nennung:$("#uNenn").value, personen:[...sel], status:$("#uStat").value,
      kosten:$("#uKosten").value.trim(), info:$("#uInfo").value.trim()});
    doc.turniere[t.id] = t; closeSheet(); await save(); render();
  });
}
function fPlan(datum){
  const p = (doc.plan||{})[datum] || {};
  sheet(`<h2>${dfmt(datum)}</h2><label>Wer übernimmt?</label>
    <div class="chips" id="lPers">${PERSONEN.map(x=>`<button class="chip ${(p.personen||[]).includes(x)?"on":""}" data-lp="${x}">${x}</button>`).join("")}</div>
    <label>Zeit</label><input type="text" id="lZeit" value="${esc(p.zeit||"")}" placeholder="15:00–16:00">
    <label>Was ist geplant?</label><select id="lAkt"><option value="">— offen —</option>${AKTIV.map(a=>`<option ${p.aktivitaet===a?"selected":""}>${a}</option>`).join("")}</select>
    <button class="prim" id="lOk">Speichern</button>
    <button class="sec" style="width:100%;margin-top:8px" id="lClear">Auf Wochenregel zurücksetzen</button>
    <button class="sec" style="width:100%;margin-top:8px" id="lAb">Abbrechen</button>`);
  const sel = new Set(p.personen||[]);
  $("#sheet").addEventListener("click", e => { const b = e.target.closest("[data-lp]");
    if(b){ const x = b.dataset.lp; if(sel.has(x)){sel.delete(x);b.classList.remove("on");} else {sel.add(x);b.classList.add("on");} } });
  $("#lAb").addEventListener("click", closeSheet);
  $("#lClear").addEventListener("click", async () => { grab("plan", datum); closeSheet(); await save(); render(); });
  $("#lOk").addEventListener("click", async () => {
    doc.plan[datum] = {datum, personen:[...sel], zeit:$("#lZeit").value.trim(), aktivitaet:$("#lAkt").value, by:me, ts:Date.now()};
    closeSheet(); await save(); render();
  });
}
function fWoche(k){
  const i = ["mo","di","mi","do","fr","sa","so"].indexOf(k), w = (doc.woche||{})[k] || {};
  sheet(`<h2>${WOCHENTAG[i]} · Wochenregel</h2><label>Wer übernimmt?</label>
    <div class="chips" id="wPers">${PERSONEN.map(p=>`<button class="chip ${(w.personen||[]).includes(p)?"on":""}" data-wp="${p}">${p}</button>`).join("")}</div>
    <label>Zeit</label><input type="text" id="wZeit" value="${esc(w.zeit||(FEST[i+1]?FEST[i+1].zeit:""))}" placeholder="15:00–16:00">
    <label>Was ist geplant?</label><select id="wAkt"><option value="">— offen —</option>${AKTIV.map(a=>`<option ${w.aktivitaet===a?"selected":""}>${a}</option>`).join("")}</select>
    <button class="prim" id="wOk">Speichern</button><button class="sec" style="width:100%;margin-top:8px" id="wAb">Abbrechen</button>`);
  const sel = new Set(w.personen||[]);
  $("#sheet").addEventListener("click", e => { const b = e.target.closest("[data-wp]");
    if(b){ const p = b.dataset.wp; if(sel.has(p)){sel.delete(p);b.classList.remove("on");} else {sel.add(p);b.classList.add("on");} } });
  $("#wAb").addEventListener("click", closeSheet);
  $("#wOk").addEventListener("click", async () => {
    doc.woche[k] = {personen:[...sel], zeit:$("#wZeit").value.trim(), aktivitaet:$("#wAkt").value, by:me, ts:Date.now()};
    closeSheet(); await save(); render();
  });
}
function fWichtig(){
  sheet(`<h2>Aushang an alle</h2><div class="dp">Kurze Mitteilung für alle – z. B. „Morgen kommt der Hufschmied, bitte 10 Uhr"</div>
    <textarea id="xText" placeholder="Nachricht …">${esc(doc.wichtig?doc.wichtig.text:"")}</textarea>
    <button class="prim" id="xOk">Speichern</button><button class="sec" style="width:100%;margin-top:8px" id="xAb">Abbrechen</button>`);
  $("#xAb").addEventListener("click", closeSheet);
  $("#xOk").addEventListener("click", async () => { doc.wichtig = {text:$("#xText").value.trim(), by:me, ts:Date.now()};
    closeSheet(); await save(); render(); });
}

/* ====== Bindung ====== */
function bind(){
  $$('[data-tedit]').forEach(b=>b.onclick=()=>me?fTermin(b.dataset.tedit):fWer());
  $$('[data-tmsg]').forEach(b=>b.onclick=()=>oeffneNachrichten({termin:b.dataset.tmsg}));
  $$('[data-tfrage]').forEach(b=>b.onclick=()=>me?fFrage({termin:b.dataset.tfrage}):fWer());
  $$('[data-antwort]').forEach(b=>b.onclick=()=>me?fAntwort(b.dataset.antwort):fWer());
  $$('[data-qopen]').forEach(b=>b.onclick=()=>oeffneNachrichten({frage:b.dataset.qopen}));
  $$('[data-qstatus]').forEach(b=>b.onclick=async()=>{if(!me)return fWer();if(setFrageStatus(b.dataset.qstatus,b.dataset.status)){await save();render();}});
  $$('[data-tagesfrage]').forEach(b=>b.onclick=()=>{if(!me)return fWer();const bez={datum:b.dataset.tagesfrage,thema:"betreuung"};oeffneNachrichten(bez);fFrage(bez);});
  if($("#nAlle")) $("#nAlle").onclick=()=>oeffneNachrichten();
  $$('[data-zusage]').forEach(b=>b.onclick=async()=>{ if(!me) return fWer(); if(sageZu(b.dataset.zusage)){ await save(); render(); } });
  $$('[data-zurueck]').forEach(b=>b.onclick=async()=>{ if(nimmZurueck(b.dataset.zurueck)){ await save(); render(); } });
  $$('[data-wer]').forEach(b=>b.onclick=fWer);
  $$('[data-pushan]').forEach(b=>b.onclick=async()=>{
    if(!me) return fWer();
    if(typeof Notification==="undefined" || !("serviceWorker" in navigator)){ alert("Dieses Gerät unterstützt keine Mitteilungen."); return; }
    let perm = Notification.permission;
    if(perm !== "granted"){ try{ perm = await Notification.requestPermission(); }catch(e){ perm = Notification.permission; } }
    if(perm !== "granted"){ alert("Ohne Erlaubnis können keine Mitteilungen ankommen. Du kannst es später erneut versuchen."); return; }
    const r = await geraetAktivieren(me, {crypto, navigator, Notification});
    if(r.aktiv){ await save(); render(); alert("Dieses Handy ist angemeldet. Die Zustellung wird noch getestet."); }
    else alert("Anmeldung nicht möglich: " + (r.grund || "unbekannt"));
  });
  $$('[data-pushaus]').forEach(b=>b.onclick=async()=>{ if(!me) return fWer(); if(aboAusschalten(b.dataset.pushaus,{navigator})){ await save(); render(); } });
  document.querySelectorAll("[data-neu]").forEach(b => b.onclick = () => {
    if(!me){ fWer(); return; }
    if(b.dataset.neu === "proto") fProto(b.dataset.datum);
    else if(b.dataset.neu === "termin") fTermin();
    else if(b.dataset.neu === "gesundheit") fGesundheit(b.dataset.art);
    else if(b.dataset.neu === "frage") fFrage(nachrichtenBezug||{});
    else if(b.dataset.neu === "turnier") fTurnier();
    else if(b.dataset.neu === "pflege") fTermin({art:b.dataset.art, wieder:Number(b.dataset.wieder)});
    else if(b.dataset.neu === "futter") fFutter();
    else if(b.dataset.neu === "zubehoer") fZubehoer();
    else if(b.dataset.neu === "kontakt") fKontakt();
    else fWichtig();
  });
  document.querySelectorAll("[data-del-proto]").forEach(b => b.onclick = async () => {
    if(!confirm("Eintrag wirklich löschen?")) return;
    grab("protokoll", b.dataset.delProto); await save(); render(); });
  document.querySelectorAll("[data-del-term]").forEach(b => b.onclick = async () => {
    if(!confirm("Termin löschen?")) return; grab("termine", b.dataset.delTerm); await save(); render(); });
  document.querySelectorAll("[data-del-turn]").forEach(b => b.onclick = async () => {
    if(!confirm("Turnier löschen?")) return; grab("turniere", b.dataset.delTurn); await save(); render(); });
  document.querySelectorAll("[data-tset]").forEach(b => b.onclick = async () => {
    const t = doc.turniere[b.dataset.tset]; if(!t) return;
    t.status = b.dataset.status; t.ts = Date.now(); t.by = me; await save(); render(); });
  document.querySelectorAll("[data-erl]").forEach(b => b.onclick = async () => {
    if(!me) return fWer();
    const t = doc.termine[b.dataset.erl]; if(!t) return;
    const wirdErledigt = !t.erledigt;
    t.erledigt = !t.erledigt; t.ts = Date.now(); t.by = me;
    if(wirdErledigt){
      const n = naechsterTermin(t, today());
      const schonDa = Object.values(doc.termine||{}).some(x => x.vorher === t.id && !x.erledigt);
      if(n && !schonDa) doc.termine[n.id] = n;
    }
    await save(); render(); });
  document.querySelectorAll("[data-plan]").forEach(b => b.onclick = () => { if(!me) return fWer(); fPlan(b.dataset.plan); });
  document.querySelectorAll("[data-verein]").forEach(b => b.onclick = async () => { await ladeVerein(true); render(); });
  document.querySelectorAll("[data-kedit]").forEach(b => b.onclick = () => fKontakt(b.dataset.kedit));
  document.querySelectorAll("[data-del-kontakt]").forEach(b => b.onclick = async () => {
    if(!confirm("Kontakt löschen?")) return; grab("kontakte", b.dataset.delKontakt); await save(); render(); });
  document.querySelectorAll("[data-del-futter]").forEach(b => b.onclick = async () => {
    if(!confirm("Futterzeit löschen?")) return; grab("futter", b.dataset.delFutter); await save(); render(); });
  document.querySelectorAll("[data-fedit]").forEach(b => b.onclick = () => { if(!me) return fWer(); fFutter(b.dataset.fedit); });
  document.querySelectorAll("[data-del-zub]").forEach(b => b.onclick = async () => {
    if(!confirm("Teil aus der Liste nehmen?")) return; grab("zubehoer", b.dataset.delZub); await save(); render(); });
  document.querySelectorAll("[data-zedit]").forEach(b => b.onclick = () => { if(!me) return fWer(); fZubehoer(b.dataset.zedit); });
  document.querySelectorAll("[data-zset]").forEach(b => b.onclick = async () => {
    const z = doc.zubehoer[b.dataset.zset]; if(!z) return;
    z.zustand = b.dataset.zustand; z.ts = Date.now(); z.by = me; await save(); render(); });
  document.querySelectorAll("[data-fut]").forEach(b => b.onclick = async () => {
    const id = b.dataset.fut, k = fKey(today(), id);
    if(doc.futterlog[k]) delete doc.futterlog[k];
    else doc.futterlog[k] = {id:k, slot:id, datum:today(), by:me, ts:Date.now()};
    await save(); render(); });
  document.querySelectorAll("[data-goto]").forEach(b => b.onclick = () => { tab = b.dataset.goto; render(); });
  document.querySelectorAll("[data-woche]").forEach(b => b.onclick = () => { if(!me) return fWer(); fWoche(b.dataset.woche); });
  document.querySelectorAll("[data-als]").forEach(b => b.onclick = () => { me = b.dataset.als; localStorage.setItem("schoki_wer", me); render(); });
  document.querySelectorAll("[data-pf]").forEach(b => b.onclick = () => { pf = b.dataset.pf; render(); });
  const now = $("#btnNow"); if(now) now.onclick = async () => { await pull(); };
}
document.querySelectorAll("nav button").forEach(b => b.onclick = () => { tab = b.dataset.tab; render(); });
$("#whoBtn").onclick = fWer;
$("#btnNeu").onclick = () => { if(!me) return fWer(); fProto(); };
$("#btnReload").onclick = async () => { await pull(); };
$("#modal").onclick = e => { if(e.target.id === "modal") closeSheet(); };
document.addEventListener("visibilitychange", () => { if(!document.hidden) pull(); });
window.addEventListener("online", () => pull());

/* ====== Start ====== */
if("serviceWorker" in navigator){ navigator.serviceWorker.register("sw.js").catch(() => {}); }
(async function start(){
  if(!codeOk){
    const c = prompt("Familien-Code für Schoki:");
    if(c !== null && c.trim().toLowerCase() !== CODE){ alert("Falscher Code."); }
    codeOk = true;
  }
  try{ const c = localStorage.getItem("schoki_cache"); if(c) merge(JSON.parse(c)); }catch(e){}
  await pull(true);
  render();
  setInterval(() => { if(!document.hidden) pull(); }, POLL);
})();
</script>
